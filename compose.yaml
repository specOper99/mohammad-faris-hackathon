x-app-env: &app-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: exoplanet
  DB_USERNAME: exoplanet
  DB_PASSWORD: exoplanet
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio12345
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: exoplanet-files
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: http://localhost:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AWS_PUBLIC_ENDPOINT: http://localhost:9000
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  LOG_CHANNEL: stderr

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - php_vendor:/var/www/html/vendor
  - php_bootstrap_cache:/var/www/html/bootstrap/cache

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes: *app-volumes
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 120s

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=120
    volumes: *app-volumes
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      php:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    volumes: *app-volumes
    env_file: .env
    environment:
      <<: *app-env
    depends_on:
      php:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exoplanet
      POSTGRES_USER: exoplanet
      POSTGRES_PASSWORD: exoplanet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exoplanet -d exoplanet"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: on-failure
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  minio:
  php_vendor:
  php_bootstrap_cache:
