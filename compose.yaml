x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: ${APP_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: exoplanet
  DB_USERNAME: exoplanet
  DB_PASSWORD: exoplanet
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio12345
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: exoplanet-files
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: http://localhost:${MINIO_API_PORT:-9000}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AWS_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: noreply@exoplanet.local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "false"
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173,localhost:8080,127.0.0.1,127.0.0.1:5173,127.0.0.1:8080
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@localhost}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPass1x}

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - php_vendor:/var/www/html/vendor

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes: *app-volumes
    environment:
      <<: *app-env
      CONTAINER_ROLE: fpm
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/app-ready && php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 180s

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120"]
    volumes: *app-volumes
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    depends_on:
      php:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes: *app-volumes
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    depends_on:
      php:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exoplanet
      POSTGRES_USER: exoplanet
      POSTGRES_PASSWORD: exoplanet
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exoplanet -d exoplanet"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    restart: on-failure
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /init.sh | sh"]

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  pgdata:
  minio:
  php_vendor:
